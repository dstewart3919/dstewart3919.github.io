<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="honey-warp" x="-12%" y="-12%" width="124%" height="124%" filterUnits="objectBoundingBox" primitiveUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.8 1.1" numOctaves="2" seed="3" result="n" />
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.028" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <filter id="card-warp" x="-8%" y="-8%" width="116%" height="116%" filterUnits="objectBoundingBox" primitiveUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.7 0.9" numOctaves="2" seed="3" result="n" />
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.022" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <filter id="bee-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.4" result="b" />
    <feColorMatrix in="b" type="matrix" values="1 0 0 0 0.25  0 0.85 0 0 0.12  0 0 0.2 0 0  0 0 0 0.85 0" result="g" />
    <feMerge>
      <feMergeNode in="g" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
</svg>
